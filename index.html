ch:focus{border-color:#75ab86}.count{color:#8b968c;font-size:13px;margin:0 0 16px}.cards{display:grid;gap:13px}.card{width:100%;border:1px solid #e5ebe5;box-shadow:0 4px 20px #17391c06;border-radius:14px;padding:21px 24px;background:white;text-align:left;display:block;transition:transform .15s,border-color .15s}.card:hover{transform:translateY(-2px);border-color:#a6cdb0}.card-top{display:flex;justify-content:space-between;align-items:center;gap:10px}.tag{font-size:11px;color:#2e8554;font-weight:750;background:#eaf5ed;border-radius:6px;padding:5px 8px}.date{font-size:12px;color:#a0aaa2}.card h3{font-size:19px;letter-spacing:-.55px;margin:14px 0 9px}.card p{font-size:13px;line-height:1.8;color:#78867b;margin:0}.arrow{float:right;color:#4d8b63;font-size:19px}.article{display:none}.back{background:transparent;border:none;padding:0;color:#3d8a59;font-weight:700;margin:7px 0 34px}.article-head .meta{font-size:12px;color:#3a875b;font-weight:800;letter-spacing:1px}.article-head h1{font-size:32px;margin:12px 0;letter-spacing:-1.1px}.article-head p{font-size:14px;color:#89958b;margin-bottom:35px}.article-body{border-top:1px solid #e5ece6;padding-top:6px;font-size:15px;line-height:1.95;color:#334039}.article-body h2{font-size:21px;letter-spacing:-.5px;margin:36px 0 16px;color:#19291f}.article-body h3{font-size:16px;margin:25px 0 8px}.article-body p{margin:11px 0}.article-body .reading{background:#f1f5f1;border-radius:11px;padding:22px 25px;line-height:2.15}.article-body .reading p{margin:5px 0}.article-body .highlight{background:#eaf5e9;padding:17px 20px;border-left:3px solid #4c9568;border-radius:0 9px 9px 0;margin:23px 0}.article-body .em{color:#25814f;font-weight:750;border-bottom:1px solid #83bd96}.article-body ul{list-style:none;padding:0}.article-body li{position:relative;margin:12px 0;padding-left:19px}.article-body li:before{content:'';width:6px;height:6px;border-radius:50%;background:#49a26d;position:absolute;top:14px;left:0}.article-body .translation{border-left:2px </style></head><body><div class="layout"><aside class="sidebar"><div class="brand"><span class="logo">✳</span><div>Daily Notes<br><small>YOUR PERSONAL LIBRARY</small></div></div><div class="nav-title">LIBRARY</div><nav class="nav" id="nav"></nav><div class="sidebar-foot">Less noise, more learning.<br>하루 한 편씩 쌓이는 지식.</div></aside><main class="main"><section id="home"><div class="hero"><div><div class="eyebrow">PERSONAL READING SPACE</div><h1>매일 읽는 학습 노트<span style="color:#3d915d">.</span></h1><p class="lead">필요한 내용만, 가장 읽기 편한 형태로.</p></div><div class="date-box" id="today"></div></div><div class="toolbar"><input class="search" id="search" type="search" placeholder="제목, 내용, 단어 검색…" aria-label="글 검색"></div><p class="count" id="count"></p><div class="cards" id="cards"></div><div class="footer">Daily Notes · 텍스트 중심 개인 학습 아카이브</div></section><article class="article" id="article"><button class="back" id="back">← 목록으로 돌아가기</button><div class="article-head" id="articleHead"></div><div class="article-body" id="articleBody"></div><div class="footer">하루 한 편의 기록이 쌓여 나만의 교재가 됩니다.</div></article></main></div><script>
const categories=[['all','전체'],['toeic','TOEIC'],['hsk','중국어 HSK'],['jlpt','일본어 JLPT'],['kaggle','Kaggle'],['news','오늘의 뉴스']];let selected='all',query='';
const posts=[
{id:'toeic-001',cat:'toeic',date:'2026.10.27',title:'TOEIC Reading · 업무 교육 일정 안내',summary:'비즈니스 공지문에서 꼭 알아야 할 마감일·등록 표현.',body:`<h2>01. 오늘의 지문</h2><div class="reading"><p>All employees are encouraged to attend the upcoming training session.</p><p>The session will focus on improving workplace communication.</p><p>Those who wish to participate must <span class="em">register by Friday</span>.</p></div><h2>02. 전체 해석</h2><div class="translation"><p>모든 직원은 예정된 교육에 참석할 것을 권장받습니다.</p><p>교육은 직장 내 의사소통 개선에 중점을 둡니다.</p><p>참가를 원하는 사람은 금요일까지 등록해야 합니다.</p></div><h2>03. 핵심 표현</h2><ul><li><strong>be encouraged to</strong> — ~하도록 권장받다. 수동태 공지 표현.</li><li><strong>focus on -ing</strong> — ~하는 데 집중하다. 전치사 on 뒤에 동명사.</li><li><strong>register by Friday</strong> — 금요일까지 등록하다. by는 마감 기한.</li></ul><div class="highlight"><strong>오늘의 포인트</strong><br>마감 기한을 나타내는 <span class="em">by</span>와 지속 기간을 나타내는 <span class="em">until</span>을 구분하자.</div>`},
{id:'hsk-001',cat:'hsk',date:'2026.10.27',title:'HSK 3급 · 了와 완료된 동작',summary:'짧은 중국어 세 문장과 완료 표현·핵심 어휘 정리.',body:`<h2>01. 오늘의 세 문장</h2><div class="reading"><p>我昨天买了一本书。</p><p>我已经看了两章。</p><p>今天我想继续看。</p></div><h2>02. 자연스러운 해석</h2><div class="translation"><p>나는 어제 책 한 권을 샀다.</p><p>나는 이미 두 장을 읽었다.</p><p>오늘도 계속 읽고 싶다.</p></div><h2>03. 표현과 문법</h2><ul><li><strong>买了 (mǎi le)</strong> — 샀다. 동작의 완료를 표현.</li><li><strong>已经 (yǐjīng)</strong> — 이미. 완료된 상황을 강조.</li><li><strong>继续 (jìxù)</strong> — 계속하다. 继续看처럼 사용.</li></ul><div class="highlight"><strong>오늘의 포인트</strong><br>동사 뒤의 <span class="em">了</span>는 대표적으로 동작의 완료를 나타낸다. 모든 과거 사건에 반드시 필요한 것은 아니다.</div>`},
{id:'jlpt-001',cat:'jlpt',date:'2026.10.27',title:'JLPT N3 · ～ようにする',summary:'매일 노력하는 습관을 말하는 세 문장과 문법 해설.',body:`<h2>01. 오늘의 세 문장</h2><div class="reading"><p>毎朝、日本語のニュースを読むようにしています。</p><p>知らない言葉があれば、ノートに書きます。</p><p>少しずつ読めるようになってきました。</p></div><h2>02. 자연스러운 해석</h2><div class="translation"><p>매일 아침 일본어 뉴스를 읽으려고 노력하고 있습니다.</p><p>모르는 단어가 있으면 노트에 적습니다.</p><p>조금씩 읽을 수 있게 되었습니다.</p></div><h2>03. 문법과 어휘</h2><ul><li><strong>～ようにする</strong> — ~하도록 노력하다, 습관으로 삼다.</li><li><strong>～ば</strong> — ~하면. 조건을 표현.</li><li><strong>～ようになる</strong> — ~하게 되다. 능력이나 상태의 변화.</li></ul><div class="highlight"><strong>오늘의 포인트</strong><br><span class="em">ようにする</span>는 스스로 노력하는 행동, <span class="em">ようになる</span>는 변화된 상태를 말할 때 자주 사용한다.</div>`},
{id:'kaggle-001',cat:'kaggle',date:'2026.10.27',title:'Kaggle · 좋은 검증 전략은 모델보다 먼저다',summary:'시계열 예측에서 데이터 누수를 피하는 사고법과 실제 적용 인사이트.',body:`<p style="color:#8b968c;font-size:13px">디자인 확인을 위한 예시 분석입니다. 실제 Kaggle 우승 솔루션의 검증된 인용문이 아닙니다.</p><h2>01. 문제 상황</h2><p>시계열 데이터를 무작위로 학습·검증 분리하면 미래 시점과 유사한 데이터가 학습에 들어가 성능을 과대평가할 수 있다.</p><h2>02. 접근 방식</h2><ul><li><strong>시간 순서를 지키는 검증</strong> — 과거 데이터로 학습하고 미래 데이터로 평가한다.</li><li><strong>그룹 누수 점검</strong> — 동일한 장비·제품·실험 단위가 양쪽에 중복되는지 확인한다.</li><li><strong>검증 분포 비교</strong> — 운영 환경과 유사한 조건을 재현한다.</li></ul><h2>03. 실무 적용 인사이트</h2><div class="highlight"><strong>내 데이터에서 이렇게 적용</strong><br>반도체 공정 데이터를 예측할 때 랜덤 셔플만 사용하지 말고, 시간·웨이퍼·랏 또는 장비 기준으로 나눈 검증 점수를 함께 비교해 보자.</div><h2>04. 다음 단계</h2><p>실제 운영을 시작하면 매일 서로 다른 <strong>공개 Kaggle 솔루션 원문 URL</strong>을 확인하고 출처와 함께 게시한다.</p>`},
{id:'news-001',cat:'news',date:'2026.10.27',title:'Daily News · 오늘의 뉴스 읽기',summary:'주요 뉴스의 사실·맥락·영어 표현을 한눈에 정리할 수 있는 템플릿.',body:`<p style="color:#8b968c;font-size:13px">시제품용 템플릿입니다. 실제 2026년 10월 27일 뉴스 기사라고 주장하지 않습니다.</p><h2>01. 오늘의 주요 흐름</h2><div class="reading"><p><strong>기술 · 산업</strong><br>기사 제목과 핵심 사실 두 문장을 배치합니다.</p><p><strong>경제 · 금융</strong><br>시장 변화와 그 원인을 구별해 정리합니다.</p><p><strong>과학 · 환경</strong><br>중요한 연구 결과와 한계를 짧게 기록합니다.</p></div><h2>02. 영어 핵심 표현</h2><ul><li><strong>according to</strong> — ~에 따르면. 정보의 출처를 밝힐 때.</li><li><strong>is expected to</strong> — ~할 것으로 예상되다. 전망과 확정 사실을 구별할 때.</li></ul><div class="highlight"><strong>자동 게시 원칙</strong><br>실제 기사 URL과 발행 날짜를 확인하고, 출처가 검증되지 않으면 해당 뉴스는 게시하지 않는다.</div>`}
];
const nav=document.getElementById('nav'),cards=document.getElementById('cards'),search=document.getElementById('search');document.getElementById('today').textContent='OCT 27, 2026';function categoryName(k){return categories.find(c=>c[0]===k)?.[1]||k}function renderNav(){nav.innerHTML='';for(const [id,label] of categories){let b=document.createElement('button');b.className=id===selected?'active':'';b.innerHTML='<span class="dot"></span>'+label;b.onclick=()=>{selected=id;showHome();renderNav();renderCards();};nav.appendChild(b)}}function renderCards(){let visible=posts.filter(p=>(selected==='all'||p.cat===selected)&&[p.title,p.summary,p.body].join(' ').toLowerCase().includes(query.toLowerCase()));document.getElementById('count').textContent=`${visible.length}개의 글`;cards.innerHTML='';for(const p of visible){let b=document.createElement('button');b.className='card';b.innerHTML=`<div class="card-top"><span class="tag">${categoryName(p.cat)}</span><span class="date">${p.date}</span></div><h3>${p.title} <span class="arrow">↗</span></h3><p>${p.summary}</p>`;b.onclick=()=>openPost(p.id);cards.appendChild(b)}if(!visible.length)cards.innerHTML='<p style="color:#8b978e">검색 결과가 없습니다.</p>'}function showHome(){document.getElementById('home').style.display='block';document.getElementById('article').style.display='none';history.replaceState(null,'',location.pathname);window.scrollTo(0,0)}function openPost(id){let p=posts.find(x=>x.id===id);if(!p)return;document.getElementById('articleHead').innerHTML=`<div class="meta">${categoryName(p.cat).toUpperCase()} · ${p.date}</div><h1>${p.title}</h1><p>${p.summary}</p>`;document.getElementById('articleBody').innerHTML=p.body;document.getElementById('home').style.display='none';document.getElementById('article').style.display='block';history.replaceState(null,'','#'+id);window.scrollTo(0,0)}document.getElementById('back').onclick=showHome;search.oninput=e=>{query=e.target.value;renderCards()};renderNav();renderCards();if(location.hash)openPost(location.hash.slice(1));
</script></body></html>
