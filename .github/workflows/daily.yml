
name: Daily Blog Update

on:
  schedule:
    - cron: '0 6 * * *'
      timezone: 'Asia/Seoul'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - name: Download blog
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Generate daily posts
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python scripts/daily.py

      - name: Save and publish
        run: |
          git config user.name "Daily Blog Bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          if ! git diff --cached --quiet; then
            git commit -m "Daily blog update"
            git push
          fi
